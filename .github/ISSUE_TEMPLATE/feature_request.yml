name: Solicitar Funcionalidad
description: Sugiere una mejora al mapa, la interfaz, o el modelo de datos.
title: "[Funcionalidad]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Aviso: este es un **sitio estático sin dependencias** por diseño — sin paso de
        compilación, sin framework. Es probable que se rechacen solicitudes que requieran
        agregar uno. Ver [CONTRIBUTING.md](../../CONTRIBUTING.md#reglas-base).
  - type: textarea
    id: problem
    attributes:
      label: ¿Qué Problema Resuelve Esto?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solución Propuesta
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas Consideradas
