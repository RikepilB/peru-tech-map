name: Agregar Empresa / Lugar
description: Sugiere una startup, consultora tecnológica, coworking, incubadora, aceleradora, VC u ONG para agregar al mapa.
title: "[Agregar]: "
labels: ["add-company"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por ayudar a hacer crecer el mapa! Si te sientes cómodo con Git, puedes
        saltarte esto y abrir un PR directamente — ver [CONTRIBUTING.md](../../CONTRIBUTING.md).
  - type: input
    id: name
    attributes:
      label: Nombre De La Empresa / Lugar
    validations:
      required: true
  - type: dropdown
    id: city
    attributes:
      label: Ciudad
      options:
        - Lima
        - Arequipa
    validations:
      required: true
  - type: input
    id: address
    attributes:
      label: Dirección
      description: Dirección legible por humanos dentro del área mapeada.
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: Sitio Web / Dominio
      description: Dominio simple, sin https:// ni www — ej. acme.com
  - type: dropdown
    id: category
    attributes:
      label: Categoría
      options:
        - Startup
        - Technology Consultancy
        - Coworking Space
        - Incubator
        - Accelerator
        - VC
        - Nonprofit
    validations:
      required: true
  - type: dropdown
    id: subcategory
    attributes:
      label: Etapa De Startup (Opcional)
      description: Completa este campo solo cuando la categoría sea Startup.
      options:
        - Pre-Seed
        - Seed
        - Bootstrap
        - Series A+
  - type: input
    id: source
    attributes:
      label: Fuente
      description: Enlace al sitio de la empresa, comunicado de prensa, o anuncio que confirme que es real.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: ¿Algo Más?
