name: Reportar Bug
description: Algo está roto en el mapa, la barra lateral, o el flujo de agregar empresa.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: ¿Qué Pasó?
      description: Qué esperabas vs. qué pasó realmente.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Pasos Para Reproducir
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador / Dispositivo
      placeholder: ej. Chrome 128 en macOS, Safari en iPhone 15
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Capturas / Errores De Consola
      description: Si aplica — revisa la consola de DevTools por errores de JS.
