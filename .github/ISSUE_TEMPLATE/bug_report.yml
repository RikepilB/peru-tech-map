name: Bug Report
description: Something's broken in the map, sidebar, or add-company flow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What Happened?
      description: What you expected vs. what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps To Reproduce
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / Device
      placeholder: e.g. Chrome 128 on macOS, Safari on iPhone 15
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Console Errors
      description: If applicable — check DevTools console for JS errors.
