name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar el contrato de los datasets
        run: python scripts/validate_data.py
      - name: Instalar dependencias Python de pruebas DOM y rendimiento
        run: python -m pip install -r tests/requirements.txt
      - name: Probar el validador reutilizable
        run: python -m unittest discover -s tests -v
      - name: Instalar Chromium para las pruebas DOM
        run: python -m playwright install --with-deps chromium
      - name: Probar render seguro en Chromium sin red
        run: python tests/browser/test_render.py -v
      - name: Verificar el harness de rendimiento sin red pública
        run: python scripts/benchmark_performance.py --runs 1 --require-list-before-map-load --require-no-repeated-set-data --output "$RUNNER_TEMP/perf-smoke.json" --trace "$RUNNER_TEMP/perf-smoke-trace.zip"
      - name: Guardar diagnóstico de rendimiento
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/perf-smoke.json
            ${{ runner.temp }}/perf-smoke-trace.zip
          retention-days: 14
