name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate companies.json is well-formed JSON
        run: python3 -m json.tool companies.json > /dev/null
      - name: Validate ticker.json is well-formed JSON
        run: python3 -m json.tool ticker.json > /dev/null
      - name: Every entry has required fields (name, city, lat, lng, funding.type)
        run: |
          python3 - <<'EOF'
          import json, sys
          data = json.load(open("companies.json"))
          errors = []
          for i, c in enumerate(data):
              for field in ("name", "city", "lat", "lng"):
                  if field not in c:
                      errors.append(f"[{i}] {c.get('name','?')}: missing '{field}'")
              if not c.get("funding", {}).get("type"):
                  errors.append(f"[{i}] {c.get('name','?')}: missing funding.type")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"OK — {len(data)} entries validated")
          EOF
