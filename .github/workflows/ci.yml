name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar el contrato de los datasets
        run: python scripts/validate_data.py
      - name: Probar el validador reutilizable
        run: python -m unittest discover -s tests -v
      - name: Instalar herramientas de pruebas DOM
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Probar render seguro en Chromium sin red
        run: python tests/browser/test_render.py -v
